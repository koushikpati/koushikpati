name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      GOOGLE_API_KEY: dummy-key-for-ci   # fake; CI must never make real LLM calls

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirement.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt
          pip install ruff pytest httpx pip-audit

      - name: Lint (ruff)
        run: ruff check .

      - name: Compile check
        run: python -m compileall -q .

      - name: Import smoke test
        run: python -c "import main"

      - name: Tests
        run: |
          pytest -q || code=$?
          # exit code 5 = no tests collected; remove this tolerance once you add tests
          [ "${code:-0}" -eq 0 ] || [ "${code}" -eq 5 ]

      - name: Dependency audit
        run: pip-audit -r requirement.txt
        continue-on-error: true   # report only; remove to make it blocking